# Connection settings live in .env.local, not .env, so that one file per target
# stays the single source of truth (see src/med_graph/config.py). Compose only
# interpolates from .env by default, so point it at the target file explicitly:
#
#   docker compose --env-file .env.local up -d neo4j
#
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: med-graph-neo4j
    ports:
      - "7474:7474" # HTTP browser UI
      - "7687:7687" # Bolt driver
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?run with --env-file .env.local}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  neo4j-data:
